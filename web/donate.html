<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Me | English Material Sharing Project</title>
    <link rel="icon" type="image/png" href="../nm.jpg">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Link đến file CSS chung -->
    <link rel="stylesheet" href="../page-style.css">

    <!-- Style tùy chỉnh riêng cho trang Donate -->
    <style>
        .glass-container {
            height: auto;
            max-width: 420px;
            text-align: center;
            padding: 2.5rem;
        }

        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
             opacity: 0.85;
             margin-bottom: 2rem;
        }
        
        /* === PHẦN QUAN TRỌNG NHẤT === */
        /* Card trắng chứa QR code */
        .qr-card {
            background-color: #fff;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        /* Ảnh QR đã được tách nền */
        .qr-image {
            max-width: 100%;
            display: block;
        }
        
        /* Thông tin người nhận */
        .qr-info {
            margin-top: 1rem;
            color: #1a1a1a;
            font-weight: 600;
        }
        .qr-info span {
            font-weight: 400;
            opacity: 0.7;
        }
        /* ============================ */
        
        .support-text p {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <a href="../index.html" class="back-to-home" aria-label="Quay về trang chủ">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <main class="glass-container">
        <header class="page-header">
            <h1><i class="fa-solid fa-heart" style="color: #ff8a8a;"></i> Cảm Ơn Bạn!</h1>
            <p>Sự ủng hộ của bạn là niềm vui và động lực rất lớn cho mình!</p>
        </header>
        
        <!-- Card chứa QR code -->
        <div class="qr-card">
            <!-- Sử dụng ảnh QR đã tách nền -->
            <img src="../web/ar.jpg" alt="QR Code ủng hộ" class="qr-image">
            
            <!-- Tái tạo lại thông tin tên và SĐT -->
            
        </div>

        <div class="support-text">
            <p>Quét mã VietQR ở trên để ủng hộ mình một ly cà phê nhé.</p>
        </div>
    </main>

</body>
</html>
